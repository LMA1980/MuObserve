[package]
name = "mu-observable-hub"
version = "0.1.1"
edition = "2021"
description = "Distributed OTEL + DuckDB/Parquet observability backend, centralized CI state store, hardware-aware benchmark/test regression engine, and Antigravity MCP server"
license = "AGPL-3.0-only"
repository = "https://github.com/LMA1980/mu-observable-hub"
default-run = "mu-observable-hub"

[features]
default = []
bundled-duckdb = ["duckdb/bundled"]

[[bin]]
name = "mu-observable-hub"
path = "src/main.rs"

[[bin]]
name = "mu-observable-mcp"
path = "src/bin/muobserve_mcp.rs"

[[bin]]
name = "mu-observable-cli"
path = "src/bin/muobserve_cli.rs"

[dependencies]
mu-observable-ipc = { git = "https://github.com/LMA1980/mu-observable-ipc.git", branch = "main" }
mu-ci-isolation = { git = "https://github.com/LMA1980/mu-ci-isolation.git", branch = "main" }
duckdb = { version = "=1.2.2", default-features = false }
arrow = { version = "54", default-features = false, features = ["ipc"] }
fory = "1.7"
zerocopy = { version = "0.8", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "net", "signal", "process"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1"
x509-parser = "0.18"
bytes = "1"
axum = { version = "0.8" }
futures-core = "0.3"
futures-util = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
